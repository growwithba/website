  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["06-friday"] = tl;

      var ROOT = document.querySelector('[data-composition-id="06-friday"]');
      var q = function (sel) {
        return gsap.utils.toArray(ROOT.querySelectorAll(sel));
      };

      var cells = q(".f06f-cell");
      var fills = q(".f06f-fill");

      /* --- The board (axis, five rules, five serif labels, gutter numerals,
         lead markers, hairlines, chrome) is INHERITED from frame 05 fully
         formed. It is never tweened here: it is present and at full strength
         from the first rendered frame. The axis progress rail already stands
         at its frame-05 landed height (row 005). --- */

      /* --- svg-path-draw setup: the column rule is measured, never guessed. --- */
      var colPath = ROOT.querySelector("#f06f-colrule-path");
      var colLen = 512;
      if (colPath && typeof colPath.getTotalLength === "function") {
        var measured = colPath.getTotalLength();
        if (measured > 0) colLen = measured;
      }
      if (colPath) {
        colPath.style.strokeDasharray = String(colLen);
        colPath.style.strokeDashoffset = String(colLen);
      }

      /* --- Scene 1 (0.0-1.4s): "Every Friday" — a new column rules itself in
         on the right of the lead-marker column (svg-path-draw, constant-rate
         pen trace), then takes its mono FRIDAY header via a clip wipe. --- */
      tl.fromTo(
        "#f06f-colrule-path",
        { strokeDashoffset: colLen },
        { strokeDashoffset: 0, duration: 0.72, ease: "none" },
        0.15
      );

      tl.fromTo(
        "#f06f-friday",
        { clipPath: "inset(0 100% 0 0)", opacity: 0 },
        { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.5, ease: "power2.out" },
        0.78
      );

      /* --- Scene 2 (1.4-2.6s): "each lead fills their own row." — five empty
         ink-faint cells cascade DOWN the column, one per row, sliding a short
         distance directly into their own slot (grid-card-assemble stagger). --- */
      cells.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
          1.45 + i * 0.14
        );
      });

      /* --- Scene 3 (2.6-4.1s): "Green, amber, red." — the cells take their
         status marks on the three spoken words. Each fill wipes across its
         cell from the left; the colour IS the status, no text inside.
         rows 1, 2, 4 = status-green · row 3 = status-amber · row 5 = status-red
         (row 5, GROWTH + AI, is the red one frames 07/08 drive). --- */
      tl.set(fills, { scaleX: 0, opacity: 1 }, 0);

      var FILL_CUES = [
        { i: 0, at: 2.7 },  /* "Green" — SMM / CREATIVE */
        { i: 1, at: 2.79 }, /* "Green" — DIGITAL */
        { i: 3, at: 2.88 }, /* "Green" — ECOMMERCE */
        { i: 2, at: 3.3 },  /* "amber" — BUSINESS DEVELOPMENT */
        { i: 4, at: 3.78 }  /* "red"   — GROWTH + AI */
      ];

      FILL_CUES.forEach(function (cue) {
        tl.fromTo(
          fills[cue.i],
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, ease: "power2.out" },
          cue.at
        );
        tl.to(
          cells[cue.i],
          { borderColor: "rgba(31, 43, 224, 0)", duration: 0.24, ease: "power1.out" },
          cue.at + 0.06
        );
      });

      /* --- Scene 4 (4.1-4.8s): held. A filled board, read at a glance. --- */
      tl.to("#f06f-friday", { opacity: 1, duration: 0.01 }, 4.72);
