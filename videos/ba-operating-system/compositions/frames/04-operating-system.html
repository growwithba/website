  <div id="root" data-composition-id="04-operating-system" data-width="1920" data-height="1080" data-duration="6.751">

    <div class="clip" id="os-stage" data-start="0" data-duration="6.751" data-track-index="2">

        <g id="os-residue">

          <line class="os-residue" x1="240" y1="452" x2="1680" y2="452"></line>
          <line class="os-residue" x1="240" y1="556" x2="1680" y2="556"></line>
          <line class="os-residue" x1="240" y1="660" x2="1680" y2="660"></line>
          <line class="os-residue" x1="240" y1="764" x2="1680" y2="764"></line>
        </g>

        <!-- THE FRAMEWORK — fixed geometry, reused by frames 05-08. Empty here. -->
        <g id="os-framework">
          <path class="os-rule" id="os-axis" d="M 240 300 L 240 812"></path>
          <path class="os-rule os-row" id="os-row-1" d="M 240 348 L 1680 348"></path>
          <path class="os-rule os-row" id="os-row-2" d="M 240 452 L 1680 452"></path>
          <path class="os-rule os-row" id="os-row-3" d="M 240 556 L 1680 556"></path>
          <path class="os-rule os-row" id="os-row-4" d="M 240 660 L 1680 660"></path>

      <div id="os-headline">
        <span class="os-word" id="os-w-0">AN</span><span class="os-word" id="os-w-1">OPERATING</span><span class="os-word" id="os-w-2">SYSTEM</span>
      </div>

      <div id="os-subline">
        <span class="os-seg" id="os-s-0">WHO OWNS WHAT</span><span class="os-seg os-seg-dot" id="os-s-1">&middot;</span><span class="os-seg" id="os-s-2">WHAT HAPPENS ON A BAD MONTH</span>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "04-operating-system";
      var DURATION = 6.251;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[FRAME_ID] = tl;

      /* ------------------------------------------------------------------
         svg-path-draw setup — dasharray/dashoffset from MEASURED length.
         ------------------------------------------------------------------ */
      function armDraw(sel, fallbackLen) {
        var p = document.querySelector(sel);
        if (!p) return fallbackLen;
        var len = fallbackLen;
        if (typeof p.getTotalLength === "function") {
          var measured = p.getTotalLength();
          if (measured && isFinite(measured) && measured > 0) len = measured;
        }
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return len;
      }

      var AXIS_LEN = armDraw("#os-axis", 512);
      var ROW_IDS = ["#os-row-1", "#os-row-2", "#os-row-3", "#os-row-4", "#os-row-5"];
      var ROW_LENS = ROW_IDS.map(function (id) { return armDraw(id, 1440); });

      /* ==================================================================
         SCENE 1 (0.0-2.2s) — the menu rows clear upward; the emptied space
         is then ruled by a framework drawing itself in. Nothing fills it.
         ================================================================== */

      // menu-row residue lifts away, top row first — the space empties.
      tl.fromTo("#os-residue line",
        { opacity: 0.5, y: 0 },
        { opacity: 0, y: -74, duration: 0.32, ease: "power2.in", stagger: 0.04 },
        0);

      // vertical axis draws first (hero is on screen well before 0.5s).
      tl.fromTo("#os-axis",
        { strokeDashoffset: AXIS_LEN },
        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
        0.30);

      // five empty rules draw left-to-right off the axis, each starting at
      // ~70% of the previous segment's duration — continuous, one hand.
      var ROW_DUR = 0.46;
      var ROW_STEP = 0.26;
      var ROW_LEAD = 0.80;
      ROW_IDS.forEach(function (id, i) {
        tl.fromTo(id,
          { strokeDashoffset: ROW_LENS[i] },
          { strokeDashoffset: 0, duration: ROW_DUR, ease: "power2.out" },
          ROW_LEAD + i * ROW_STEP);
      });

      /* ------------------------------------------------------------------
         dynamic-content-sequencing — per-item windows computed ONCE from
         content length + per-item config; no hardcoded per-word offsets.
         ------------------------------------------------------------------ */
      var BASE_DURATION = 0.16;
      var SEC_PER_CHAR = 0.035;
      var HOLD_MID = 0.06;

      function sequence(items) {
        var cumulative = 0;
        return items.map(function (item) {
          var dur = BASE_DURATION + item.text.length * SEC_PER_CHAR + (item.hold || HOLD_MID);
          var start = cumulative;
          cumulative += dur;
          return { text: item.text, sel: item.sel, start: start, end: cumulative };
        });
      }

      /* ==================================================================
         SCENE 2 (2.2-3.6s) — "It answers who owns what": the phrase
         AN OPERATING SYSTEM sets above the framework, word by word.
         ================================================================== */
      var HEAD_START = 2.25;
      var HEAD_SEQ = sequence([
        { text: "AN", sel: "#os-w-0" },
        { text: "OPERATING", sel: "#os-w-1" },
        { text: "SYSTEM", sel: "#os-w-2" }
      ]);

      HEAD_SEQ.forEach(function (entry) {
        tl.fromTo(entry.sel,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
          HEAD_START + entry.start);
      });

      /* ==================================================================
         SCENE 3 (3.6-5.2s) — "and what happens on a bad month": the mono
         legend reveals beneath the framework. The framework stays EMPTY.
         ================================================================== */
      var SUB_START = 3.62;
      var SUB_SEQ = sequence([
        { text: "WHO OWNS WHAT", sel: "#os-s-0" },
        { text: "·", sel: "#os-s-1", hold: 0.02 },
        { text: "WHAT HAPPENS ON A BAD MONTH", sel: "#os-s-2" }
      ]);

      SUB_SEQ.forEach(function (entry) {
        tl.fromTo(entry.sel,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" },
          SUB_START + entry.start);
      });

      /* ------------------------------------------------------------------
         Macro move under the whole shot — the grid plane drifts a touch
         wider than the framework, giving layered depth without a 2nd hue.
         ------------------------------------------------------------------ */
      tl.fromTo("#os-grid",
        { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.035, duration: DURATION, ease: "none" },
        0);

      tl.fromTo("#os-frame-svg",
        { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.007, duration: DURATION, ease: "none" },
        0);

      /* ==================================================================
         SCENE 4 (5.2-6.251s) — held read. An empty structure waiting to be
         filled. Only a quiet settle on the ruling; no exit, nothing added.
         ================================================================== */
      tl.fromTo("#os-framework",
        { opacity: 0.94 },
        { opacity: 1, duration: 0.6, ease: "power1.out" },
        5.2);
    })();
  </script>
