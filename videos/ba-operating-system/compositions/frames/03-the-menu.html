    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="03-the-menu"]');
        var q = function (s) {
          return root.querySelector(s);
        };
        var qa = function (s) {
          return Array.prototype.slice.call(root.querySelectorAll(s));
        };

        /* ---- QR block: deterministic hand-authored 8x8 mosaic ---- */
        var QR = "1110101110001100101110101000101111101101000001101101100110110111";
        var qr = q(".f03-the-menu-qr");
        for (var i = 0; i < 64; i++) {
          var cell = document.createElement("i");
          cell.style.background = QR.charAt(i) === "1" ? "#1F2BE0" : "rgba(31,43,224,0.10)";
          qr.appendChild(cell);
        }

        /* ---- dynamic-content-sequencing: row start times computed from
               content length + per-item config, reduced ONCE into a flat
               TIMELINE. No per-frame recomputation anywhere.            ---- */
        var ROWS_START = 2.0,
          BASE_DURATION = 0.95,
          SEC_PER_CHAR = 0.035,
          HOLD_MID = 0.03;
        var CONTENT = [{ label: "SOCIAL POSTS" }, { label: "PAID ADS" }, { label: "SEO" }];
        var cumulative = ROWS_START;
        var TIMELINE = CONTENT.map(function (entry) {
          var dur = BASE_DURATION + entry.label.length * SEC_PER_CHAR + HOLD_MID;
          var start = cumulative;
          cumulative += dur;
          return { label: entry.label, start: start, end: cumulative };
        });

        /* the same line, printed three times — sameness is the content */
        TIMELINE.forEach(function (entry, r) {
          qa('.f03-the-menu-row[data-row="' + r + '"] .f03-the-menu-cell').forEach(function (c) {
            c.textContent = entry.label;
          });
        });

        var hairs = qa(".f03-the-menu-hair");
        var agencies = qa(".f03-the-menu-agency");
        var headrule = q(".f03-the-menu-panel-l .f03-the-menu-headrule");
        var pricerule = q(".f03-the-menu-pricerule");
        var pricehead = q(".f03-the-menu-pricehead");
        var wash = q(".f03-the-menu-wash");
        var steptags = qa(".f03-the-menu-steptag");
        var bars = qa(".f03-the-menu-bar");
        var conn = q(".f03-the-menu-connector path");
        var qrCells = qa(".f03-the-menu-qr i");
        var cam = q(".f03-the-menu-cam");
        var dimmable = [q(".f03-the-menu-panel-l"), q(".f03-the-menu-figtag")];

        var CONN_LEN = conn.getTotalLength() || 490;
        gsap.set(conn, { strokeDasharray: CONN_LEN, strokeDashoffset: CONN_LEN });
        gsap.set(bars, { scaleX: 0 });
        gsap.set(hairs, { scaleX: 0, transformOrigin: "center center" });
        gsap.set([headrule, pricerule], { scaleX: 0 });
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ================= Scene 1 (0.0 – 2.0) — open the board ================= */
        tl.fromTo(hairs, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo(
          q(".f03-the-menu-eyebrow"),
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          0.05,
        );
        tl.fromTo(
          q(".f03-the-menu-figtag"),
          { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          [q(".f03-the-menu-chrome-l"), q(".f03-the-menu-chrome-r")],
          { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power3.out" },
          0.55,
        );

        /* three unnamed agencies snap in across the top — identical treatment */
        tl.fromTo(
          agencies,
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power4.out", stagger: 0.11 },
          0.85,
        );
        tl.fromTo(
          headrule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.6, ease: "power3.out" },
          0.92,
        );

        /* the price column's empty slot is established early — the focal frame */
        tl.fromTo(wash, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.3);
        tl.fromTo(
          pricehead,
          { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
          1.45,
        );
        tl.fromTo(
          pricerule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power3.out" },
          1.5,
        );
        tl.fromTo(
          qrCells,
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "none", stagger: 0.006 },
          1.75,
        );

        /* ===== Scenes 2–4 (2.0 – 5.9) — one identical line, three times, thrice ===== */
        TIMELINE.forEach(function (entry, r) {
          var cells = qa('.f03-the-menu-row[data-row="' + r + '"] .f03-the-menu-cell');
          var divider = q('.f03-the-menu-div[data-div="' + r + '"]');
          tl.fromTo(
            cells,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.055 },
            entry.start,
          );
          tl.fromTo(
            divider,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power3.out" },
            entry.start + 0.12,
          );
        });

        /* ========= Scene 5 (5.9 – 7.8) — everything dims but the price ========= */
        var DIM_AT = 5.9;
        tl.to(dimmable, { opacity: 0.22, duration: 0.62, ease: "power2.out" }, DIM_AT);
        tl.to(
          [q(".f03-the-menu-chrome-l"), q(".f03-the-menu-chrome-r")],
          { opacity: 0.35, duration: 0.62, ease: "power2.out" },
          DIM_AT,
        );

        /* descending step: each mark undercuts the last (scaleX from a left origin) */
        var STEP_AT = [6.15, 6.68, 7.2];
        bars.forEach(function (bar, i) {
          tl.fromTo(
            steptags[i],
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            STEP_AT[i] - 0.1,
          );
          tl.fromTo(
            bar,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power3.out" },
            STEP_AT[i],
          );
        });

        /* the staircase drawn between the marks — the slide downward */
        tl.fromTo(
          conn,
          { strokeDashoffset: CONN_LEN },
          { strokeDashoffset: 0, duration: 1.25, ease: "none" },
          6.3,
        );

        /* ===== Scene 6 (7.8 – 8.725) — held. A flat, airless board. =====
           Only the barely-there push continues; nothing new arrives, nothing exits. */
        tl.fromTo(
          cam,
          { scale: 1, transformOrigin: "50% 50%" },
          { scale: 1.012, duration: 8.725, ease: "none" },
          0,
        );

        window.__timelines["03-the-menu"] = tl;
      })();
    </script>
