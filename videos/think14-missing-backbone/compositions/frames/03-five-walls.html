  <div

        <path d="M 969 597 L 991 597 M 980 597 L 980 649 M 969 649 L 991 649" />

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var root = document.querySelector('[data-composition-id="03-five-walls"]');
      var q = function (sel) {
        return root.querySelectorAll(sel);
      };
      var one = function (sel) {
        return root.querySelector(sel);
      };

      var bars = [];
      var caps = [];
      var nums = [];
      var fills = [];
      for (var i = 1; i <= 5; i++) {
        var bar = one('.fw03-bar[data-bar="' + i + '"]');
        bars.push(bar);
        caps.push(bar.querySelector(".fw03-cap"));
        nums.push(one('.fw03-num[data-num="' + i + '"]'));
      }
      var tickTracks = q(".fw03-tick-track");
      for (var t = 0; t < tickTracks.length; t++) {
        fills.push(tickTracks[t].querySelector(".fw03-tick-fill"));
      }

      // one spoken cue per course — Scene 1..5 windows
      var CUES = [0.15, 1.95, 3.75, 5.55, 7.35];
      // growth block scaleY as the wall gains height (bottom-anchored)
      var GROWTH = [0.23, 0.419, 0.609, 0.798, 0.988];

      // ---- build-time pre-states (nothing on screen before its spoken cue) ----
      gsap.set(bars, { x: -620, opacity: 0 });
      gsap.set(caps, { scaleY: 0, transformOrigin: "50% 50%" });
      gsap.set(nums, { opacity: 0, x: -26 });
      gsap.set("#fw03-eyebrow", { opacity: 0, x: -22 });
      gsap.set("#fw03-accent", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#fw03-rail", { opacity: 0, y: 20 });
      gsap.set("#fw03-ticks", { opacity: 0 });

      // ---- header chrome ----
      tl.fromTo(
        "#fw03-accent",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#fw03-eyebrow",
        { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
        0.05
      );

      // ---- background growth block: present, empty, bottom-anchored ----
      gsap.set("#fw03-growth", { scaleY: 0, transformOrigin: "50% 100%" });

      // ---- right rail arrives quiet ----
      tl.fromTo(
        "#fw03-rail",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        "#fw03-ticks",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.34
      );
      gsap.set(fills, { scaleX: 0, transformOrigin: "0% 50%" });

      // ---- five courses, one per spoken blocker ----
      for (var n = 0; n < 5; n++) {
        var c = CUES[n];

        // course slides in from the left and locks
        tl.fromTo(
          bars[n],
          { x: -620, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          c
        );
        // the lock: the cap seats itself
        tl.fromTo(
          caps[n],
          { scaleY: 0, transformOrigin: "50% 50%" },
          { scaleY: 1, duration: 0.34, ease: "power3.out" },
          c + 0.5
        );
        // its numeral reveals in the gutter
        tl.fromTo(
          nums[n],
          { opacity: 0, x: -26 },
          { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" },
          c + 0.28
        );
        // older numerals dim by position
        if (n > 0) {
          tl.to(
            nums[n - 1],
            { opacity: 0.42, duration: 0.4, ease: "power2.out" },
            c + 0.1
          );
        }
        // the lavender block grows with the stack
        tl.to(
          "#fw03-growth",
          { scaleY: GROWTH[n], duration: 0.6, ease: "power3.out" },
          c + 0.18
        );
        // the rail ledger fills one notch
        tl.to(
          fills[n],
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          c + 0.34
        );
      }

      // ---- Scene 3: the wall passes the rail; the rail takes less weight ----
      tl.to("#fw03-rail", { opacity: 0.75, duration: 0.7, ease: "power2.out" }, 4.35);
      tl.to("#fw03-ticks", { opacity: 0.75, duration: 0.7, ease: "power2.out" }, 4.35);

      // ---- Scene 5: the fifth lands and the whole wall settles ----
      tl.fromTo(
        "#fw03-wall",
        { y: -6 },
        { y: 0, duration: 0.55, ease: "power3.out" },
        7.95
      );

      // ---- Scene 5: hairline ties snap between the courses (svg-path-draw) ----
      var ties = q(".fw03-ties path");
      for (var p = 0; p < ties.length; p++) {
        var len = ties[p].getTotalLength() * 1.02;
        ties[p].style.strokeDasharray = String(len);
        ties[p].style.strokeDashoffset = String(len);
        tl.to(
          ties[p],
          { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
          8.05 + p * 0.17
        );
      }

      // ---- rail counter: pre-computed sequence, DOM swap only on transition ----
      var SEQUENCE = [{ start: 0, label: "0" }];
      for (var s = 0; s < CUES.length; s++) {
        SEQUENCE.push({ start: CUES[s] + 0.34, label: String(s + 1) });
      }
      function entryAt(time) {
        for (var i2 = SEQUENCE.length - 1; i2 >= 0; i2--) {
          if (time >= SEQUENCE[i2].start) return SEQUENCE[i2];
        }
        return SEQUENCE[0];
      }
      var countEl = one("#fw03-count");
      var driver = { t: 0 };
      var lastLabel = "";
      tl.to(
        driver,
        {
          t: 10.923,
          duration: 10.923,
          ease: "none",
          onUpdate: function () {
            var e = entryAt(driver.t);
            if (e.label !== lastLabel) {
              countEl.textContent = e.label;
              lastLabel = e.label;
            }
          },
        },
        0
      );

      window.__timelines["03-five-walls"] = tl;
    })();
  </script>
