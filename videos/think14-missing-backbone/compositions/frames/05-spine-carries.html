  <script>
    (function () {
      var FRAME_ID = "05-spine-carries";
      var DUR = 6.955;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var field = q(".sc05-field");
      var rule = q(".sc05-rule");
      var eyebrow = q(".sc05-eyebrow");
      var load = q(".sc05-load");
      var spine = q(".sc05-spine");
      var wedge = q(".sc05-wedge");
      var conns = qa(".sc05-conn");
      var markers = qa(".sc05-marker");
      var chips = qa(".sc05-chip");
      var nums = qa(".sc05-num");
      var labels = qa(".sc05-label");

      // svg-path-draw setup — dash pattern from measured geometry, never guessed.
      var wlen = wedge.getTotalLength ? wedge.getTotalLength() : 652;
      wedge.style.strokeDasharray = String(wlen);
      wedge.style.strokeDashoffset = String(wlen);
      var clens = conns.map(function (c) {
        var l = c.getTotalLength ? c.getTotalLength() : 105;
        c.style.strokeDasharray = String(l);
        c.style.strokeDashoffset = String(l);
        return l;
      });

      // static transform origins (spring-pop: anchored at the spine side)
      gsap.set(rule, { transformOrigin: "0% 50%" });
      gsap.set(markers, { transformOrigin: "50% 50%" });
      gsap.set(chips, { transformOrigin: "0% 50%" });

      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.3s) — the spine, carried in from Frame 4, restrokes
            once in wedge orange, then settles back to primary. ────────────── */
      tl.fromTo(field, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0);
      tl.fromTo(spine, { opacity: 0.25 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 0);
      tl.fromTo(rule, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.06);
      tl.fromTo(eyebrow, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.14);
      tl.fromTo(wedge, { strokeDashoffset: wlen, opacity: 1 }, { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" }, 0.42);
      tl.to(wedge, { opacity: 0, duration: 0.3, ease: "power1.out" }, 1.04);

      /* ── Scenes 2–6 — one node per VO beat: marker springs onto the spine,
            connector draws out, chip pops anchored at the connector, label
            typesets in behind a mask-wipe. Same five labels, same order as
            Frame 3's wall — now carried instead of stacked. ───────────────── */
      var NODE_T = [1.32, 2.32, 3.22, 4.12, 5.02];
      for (var i = 0; i < NODE_T.length; i++) {
        var t = NODE_T[i];
        tl.fromTo(markers[i], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, t);
        tl.fromTo(conns[i], { strokeDashoffset: clens[i] }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.1);
        tl.fromTo(chips[i], { opacity: 0, scale: 0.88, x: -18 }, { opacity: 1, scale: 1, x: 0, duration: 0.52, ease: "power3.out" }, t + 0.14);
        tl.fromTo(nums[i], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t + 0.24);
        tl.fromTo(labels[i], { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.44, ease: "power2.out" }, t + 0.26);
      }

      /* ── Scene 6 tail (~5.7s) — the spine takes the load in a single beat:
            every connector and the spine itself thicken one step together. ── */
      var LOAD_T = 5.72;
      for (var c = 0; c < conns.length; c++) {
        tl.fromTo(conns[c], { strokeWidth: 4 }, { strokeWidth: 7, duration: 0.34, ease: "power2.out" }, LOAD_T);
      }
      tl.fromTo(spine, { strokeWidth: 6 }, { strokeWidth: 9, duration: 0.34, ease: "power2.out" }, LOAD_T);
      for (var k = 0; k < chips.length; k++) {
        tl.fromTo(chips[k], { borderColor: "rgba(91,31,199,0.2)" }, { borderColor: "rgba(91,31,199,0.36)", duration: 0.34, ease: "power2.out" }, LOAD_T);
      }

      /* ── Scene 7 (6.1–6.955s) — held. sine-wave-loop at the low end of its
            amplitude range: a single half-cycle so the frame is dead still at
            hand-off (sin(0) = sin(pi) = 0 — no jump in, no drift out). ────── */
      var IDLE_START = 6.16;
      var IDLE_DUR = DUR - IDLE_START;
      var Y_AMP_PX = 2.4;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            load.style.transform =
              "translateY(" + (Math.sin(phase.p) * Y_AMP_PX).toFixed(3) + "px)";
          }
        },
        IDLE_START
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
