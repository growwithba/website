      var tl = gsap.timeline({ paused: true });

      var chips = document.querySelectorAll(".wyk-chip");

      /* --- background: faint hairline grid settles in --- */
      tl.fromTo(
        "#wyk-grid",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        0
      );

      /* --- Scene 1a (0.05-0.55): five muted chips arrive spread across the row --- */
      chips.forEach(function (el, i) {
        var tx = Number(el.dataset.targetX);
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: tx,
            y: 14,
            scale: 0.94,
            opacity: 0,
          },
          {
            x: tx,
            y: 0,
            scale: 1,
            opacity: 1,
            duration: 0.45,
            ease: "power3.out",
          },
          0.05 + i * 0.05
        );
      });

      /* --- Scene 1b (0.72-1.20): center-outward-expansion run INWARD.
             x lerps target -> 0 over the baked xPercent/yPercent:-50 centering,
             accelerating (in-ease) so the cluster's velocity matches the swap. --- */
      chips.forEach(function (el, i) {
        tl.to(
          el,
          { x: 0, scale: 0.8, duration: 0.48, ease: "power2.in" },
          0.72 + i * 0.015
        );
        /* the five dissolve into one another as they pile on the shared origin */
        tl.to(el, { opacity: 0.5, duration: 0.18, ease: "power1.in" }, 1.02);
      });

      /* --- Scene 1c (1.15-1.80): scale-swap-transition into one solid THINK14 chip.
             Outgoing shrinks + fades fast (power2.in); incoming pops with weight
             (back.out) starting OVERLAP before the exit lands, z-index above. --- */

        "#wyk-cluster",
        { scale: 0.72, opacity: 0, duration: 0.3, ease: "power2.in" },
        1.15
      );
      tl.fromTo(
        "#wyk-think",
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
        1.3
      );

        "#wyk-line1",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        1.72

        "#wyk-line2",
