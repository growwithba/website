  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var scope =
        document.querySelector('[data-composition-id="01-the-wall"]') || document;
      var all = function (sel) {
        return scope.querySelectorAll(sel);
      };
      var one = function (sel) {
        return all(sel)[0];
      };

      /* ── Scene 1 (0.0–1.5s) — ground settles, eyebrow parks, line one lands ── */

      tl.fromTo(
        one("#the-wall-grid"),
        { opacity: 0 },
        { opacity: 1, duration: 0.65, ease: "power1.out" },
        0,
      );

      tl.fromTo(
        one("#the-wall-eyebrow-tick"),
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.08,
      );
      tl.fromTo(
        one("#the-wall-eyebrow-text"),
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" },
        0.14,
      );

      /* ── per-word staggered reveal (dynamic-content-sequencing) ─────────────
         Each line's word windows are pre-computed ONCE from the content itself —
         no hardcoded per-word offsets. Each line's cue is its spoken beat. */
      var LINES = [
        { sel: "#the-wall-l1", cue: 0.22, stagger: 0.115, dur: 0.66, rise: 20 },
        { sel: "#the-wall-l2", cue: 1.58, stagger: 0.105, dur: 0.62, rise: 20 },
        { sel: "#the-wall-l3", cue: 3.3, stagger: 0.135, dur: 0.74, rise: 30 },
      ];

      var WORD_TIMELINE = [];
      LINES.forEach(function (line) {
        var words = all(line.sel + " .the-wall-w");
        for (var i = 0; i < words.length; i++) {
          WORD_TIMELINE.push({
            el: words[i],
            start: line.cue + i * line.stagger,
            dur: line.dur,
            rise: line.rise,
          });
        }
      });

      WORD_TIMELINE.forEach(function (item) {
        tl.fromTo(
          item.el,
          { opacity: 0, y: item.rise, filter: "blur(7px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: item.dur,
            ease: "power3.out", /* long-tail settle */
          },
          item.start,
        );
      });

      /* ── Scene 3 (2.8–4.4s) — the rule draws, then line three breaks wider ── */

      /* svg-path-draw: dash pattern from the measured path length, never guessed */
      var rulePath = one("#the-wall-rule-path");
      if (rulePath && rulePath.getTotalLength) {
        var len = rulePath.getTotalLength();
        rulePath.style.strokeDasharray = String(len);
        rulePath.style.strokeDashoffset = String(len);
        tl.to(
          rulePath,
          { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
          2.86,
        );
      }

      /* ZERO carries the emphasis by weight + scale alone — one extra scale beat
         layered on top of its word reveal, no glow, no colour flash. */
      tl.fromTo(
        one("#the-wall-zero"),
        { scale: 0.9 },
        { scale: 1, duration: 0.82, ease: "power3.out" },
        3.3,
      );

      /* ── Scene 4 (4.4–5.547s) — held. Nothing moves. The stillness is the beat. */

      window.__timelines["01-the-wall"] = tl;
    })();
