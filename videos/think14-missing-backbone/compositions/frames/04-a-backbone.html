  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-a-backbone"] = tl;

      var DURATION = 2.453;

      /* ── Scene 1 (0.0–1.2s) · svg-path-draw ──────────────────────────────
         Measured geometry, never a magic number. Dash = full path length,
         offset tweened length → 0 so the pen traces DOWNWARD from the top.
         power2.out — a hand lifting at the end of the stroke.            */
      var spine = document.getElementById("bb-spine");
      var len = 480; /* authored geometry, used if measurement is unavailable */
      if (spine) {
        try {
          var measured = spine.getTotalLength();
          if (measured > 0) len = measured;
        } catch (e) {}
        spine.style.strokeDasharray = String(len);
        spine.style.strokeDashoffset = String(len);

        tl.fromTo(
          spine,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
          0.12
        );
      }

      /* ── Scene 2 (1.2–2.0s) ──────────────────────────────────────────────
         The lavender label lands first, then BACKBONE sets itself beside
         the spine via a staggered reveal whose cadence is pre-computed
         from content (dynamic-content-sequencing): a flat TIMELINE array
         built ONCE at author time, each entry carrying absolute start/end;
         the sequencer only orchestrates timing, each entry's entrance is
         its own tween scheduled at that absolute start.                  */
      tl.fromTo(
        "#bb-label",
        { opacity: 0, yPercent: 40 },
        { opacity: 1, yPercent: 0, duration: 0.34, ease: "power2.out" },
        1.16
      );

      var LETTERS = "BACKBONE".split("");
      var BASE_DURATION = 0.03; /* minimum window per entry */
      var SEC_PER_CHAR = 0.025; /* content-driven term */
      var HOLD = 0;
      var WORD_START = 1.24;

      var cumulative = 0;
      var TIMELINE = LETTERS.map(function (ch, i) {
        var dur = BASE_DURATION + ch.length * SEC_PER_CHAR + HOLD;
        var start = cumulative;
        cumulative += dur;
        return { ch: ch, index: i, start: start, end: cumulative };
      });

      TIMELINE.forEach(function (entry) {
        tl.fromTo(
          "#bb-word .bb-ch-" + entry.index,
          { opacity: 0, yPercent: 22 },
          { opacity: 1, yPercent: 0, duration: 0.3, ease: "power2.out" },
          WORD_START + entry.start
        );
      });

      /* ── Scene 3 (2.0–2.453s) · held read ────────────────────────────────
         Absolute stillness. No drift, no jitter, no glow — an inert hold
         that carries the timeline to full duration.                      */
      var HOLD_FROM = 1.94;
      tl.to({}, { duration: DURATION - HOLD_FROM }, HOLD_FROM);
    })();
